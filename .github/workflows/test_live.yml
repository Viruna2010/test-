name: VIRU FM YouTube Live Test

on:
  workflow_dispatch: # Actions ටැබ් එකෙන් Manual Run කරන්න

jobs:
  stream_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Google Chrome, FFmpeg and Audio Drivers
      run: |
        sudo apt update
        sudo apt install -y chromium-browser ffmpeg pulseaudio xvfb xdotool alsa-utils

    - name: Setup Virtual Display and Audio (Xvfb & PulseAudio)
      run: |
        # 1. Virtual Display එක පණගැන්වීම
        Xvfb :99 -screen 0 1280x720x24 &
        echo "DISPLAY=:99" >> $GITHUB_ENV
        sleep 2

        # 2. PulseAudio Directories සාදා අවසර ලබා දීම
        mkdir -p ~/.config/pulse
        
        # 3. PulseAudio Daemon එක System එක ඇතුලේ බලෙන් Start කිරීම
        pulseaudio --start --exit-idle-time=-1 --realtime=no --system=false
        sleep 5
        
        # 4. Audio සිග්නල් එක අල්ලගන්න Null Sink එකක් නිර්මාණය කිරීම
        pactl load-module module-null-sink sink_name=vfm_sink sink_properties=device.description=Virtual_Sink
        pactl set-default-sink vfm_sink
        echo "PulseAudio Successfully Configured!"

    - name: Open Radio Site & Auto Click Play Button
      run: |
        export DISPLAY=:99
        # බ්‍රවුසර් එක පසුබිමෙන් ඕපන් කරනවා
        chromium-browser --autoplay-policy=no-user-gesture-required --no-sandbox "https://vercel.app" &
        sleep 10
        
        # ⚡ සයිට් එක ලෝඩ් වුණාම "Play Radio" බටන් එක ඔටෝම ක්ලික් කිරීම
        xdotool key Tab
        sleep 1
        xdotool key Return
        echo "Play Button Clicked Automatically!"
        sleep 5

    - name: Stream to YouTube Live (Run for 10 Minutes)
      run: |
        export DISPLAY=:99
        # විනාඩි 10කින් (තත්පර 600) මේ ටෙස්ට් එක ඔටෝම නතර වෙනවා
        timeout 600s ffmpeg -f x11grab -video_size 1280x720 -i :99.0 -f pulse -i vfm_sink.monitor -c:v libx264 -preset veryfast -b:v 2500k -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://://youtube.com{{ secrets.YOUTUBE_STREAM_KEY }}"
